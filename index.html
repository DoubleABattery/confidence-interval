<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width; initial-scale=1.0">
    <title>Capture The Parameter!</title>
    <style>
      body {
        background: white;
        color: black;
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 40px;
      }

      canvas {
        display: block;
        margin: 20px auto;
      }

      button {
        padding: 12px 24px;
        font-size: 18px;
        cursor: pointer;
        border: none;
        border-radius: 10px;
        color: white;
      }

      
      #result {
        margin-top: 20px;
        font-size: 24px;
      }

      #stopButton {
        background-color: red;
      }
      #startButton {
        background-color: green;
      }
      #restartButton {
        background-color: lime;
        margin: 20px auto;
      }
      button:hover {
        opacity: 0.8;
      }

      #count {
        margin-top: 20px;
        font-size: 20px;
      }
      #scoreMessage {
        margin-top: 10px;
        font-size: 24px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Capture The Parameter</h1>
    <p>You have a confidence interval. Your goal is to capture the true parameter (green line) with 
      as much accuracy as possible. Good luck!
    </p>

    <canvas id="gameCanvas" width="800" height="200"></canvas>

    <button id="stopButton">Capture</button>
    <button id="startButton">Start</button>
    <div id="result"></div>
    <div id="count">Score: <span id="captureCount">0</span> / 10</div>
    <div id="scoreMessage">Your interval captured the true parameter <span id="captureMessage"></span>% of the time.</div>
    <button id="restartButton">Restart</button>

    
  </body>
  <script src="script.js"></script>
</html>
